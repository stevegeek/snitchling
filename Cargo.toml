[package]
name = "snitchling"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ksni = { version = "0.3.7", features = ["tokio"] }
prost = "0.14.4"
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
slint-build = "1.18.1"
tonic-prost-build = "0.14.6"

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
tempfile = "3.27.0"
tower = "0.5.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# grpc-go (the OpenSnitch daemon) sends the unix socket path as :authority,
# which stock h2 rejects; see vendor/h2/src/server.rs ("snitchling patch").
[patch.crates-io]
h2 = { path = "vendor/h2" }
